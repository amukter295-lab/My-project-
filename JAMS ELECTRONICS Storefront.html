    function showToast(msg, type = "success") {
      const container = document.getElementById("toast-container");
      const el = document.createElement("div");
      const colors = type === "error"
        ? "bg-red-700 text-white border-white"
        : "bg-yellow-400 text-red-950 border-red-600";
      el.className = `${colors} border-2 px-4 py-3 rounded-2xl shadow-2xl font-black text-xs flex items-center justify-between transition transform`;
      el.innerHTML = `<span>${msg}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 300);
      }, 2800);
    }

    function addProductReview(e, productId) {
      e.preventDefault();
      const p = appData.products.find(x => x.id === productId);
      if (!p) return;
      if (!p.reviews) p.reviews = [];
      p.reviews.unshift({
        user: appData.currentUser.name,
        rating: 5,
        text: document.getElementById("rev-text").value.trim()
      });
      saveState();
      showToast("Review Published!");
      openProductDetails(productId);
    }

    function addToCart(productId, size = null, color = null, qty = 1, goCheckout = false) {
      const p = appData.products.find(item => item.id === productId);
      if (!p) return;
      if (p.stock <= 0) {
        showToast("Sorry, this item is currently out of stock!", "error");
        return;
      }

      const chosenSize = size || p.sizes[0] || "Standard";
      const chosenColor = color || p.colors[0] || "Default";
      const existing = appData.cart.find(c => c.productId === p.id && c.size === chosenSize && c.color === chosenColor);

      if (existing) {
        existing.qty += qty;
      } else {
        appData.cart.push({
          productId: p.id,
          name: p.name,
          image: p.imageUrl,
          price: p.discountPrice,
          size: chosenSize,
          color: chosenColor,
          packDetails: `${p.packSize} (${p.quantityPerPack} pcs)`,
          qty
        });
      }

      saveState();
      syncHeaderSecurity();
      closeModal();

      if (goCheckout) {
        navigateTo("cart");
        openCheckoutModal();
      } else {
        showToast(`Added "${p.name}" to Cart!`);
        renderApp();
      }
    }

    function toggleWishlist(productId, e) {
      if (e) e.stopPropagation();
      if (appData.wishlist.includes(productId)) {
        appData.wishlist = appData.wishlist.filter(id => id !== productId);
        showToast("Removed from Wishlist");
      } else {
        appData.wishlist.push(productId);
        showToast("Added to Wishlist!");
      }
      saveState();
      renderApp();
    }

    function confirmPlaceOrder(e) {
      e.preventDefault();
      const payMethod = document.querySelector('input[name="pay-opt"]:checked').value;
      const subtotal = appData.cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const delivery = subtotal >= 999 ? 0 : 40;
      const discount = uiState.appliedCoupon ? Math.round(subtotal * 0.1) : 0;
      const totalAmount = Math.max(0, subtotal + delivery - discount);

      // Update product stock
      appData.cart.forEach(item => {
        const prod = appData.products.find(p => p.id === item.productId);
        if (prod) prod.stock = Math.max(0, prod.stock - item.qty);
      });

      const orderId = "ORD-" + Math.floor(10000 + Math.random() * 90000);
      const expectedDate = new Date(Date.now() + 2 * 86400000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

      const newOrder = {
        id: orderId,
        customerId: appData.currentUser.uid,
        customerName: document.getElementById("ord-name").value.trim(),
        customerMobile: document.getElementById("ord-mobile").value.trim(),
        address: document.getElementById("ord-addr").value.trim(),
        pinCode: document.getElementById("ord-pin").value.trim(),
        items: [...appData.cart],
        deliveryCharge: delivery,
        totalAmount,
        paymentMethod: payMethod,
        paymentStatus: payMethod === "Cash on Delivery" ? "Pending (COD)" : "Paid",
        orderStatus: "Order Placed",
        orderDate: Date.now(),
        expectedDelivery: expectedDate,
        deliveredAt: null,
        returnRequest: null
      };

      appData.orders.unshift(newOrder);
      appData.cart = [];
      uiState.appliedCoupon = null;

      appData.notifications.unshift({
        id: Date.now(),
        title: `New Order #${orderId}`,
        msg: `Order placed by ${newOrder.customerName} (₹${totalAmount}).`,
        time: "Just now"
      });

      saveState();
      syncHeaderSecurity();
      closeModal();
      showToast(`Order #${orderId} Placed Successfully!`);
      navigateTo("account");
    }

      order.orderStatus = "Return Requested";
      order.returnRequest = {
        reason: document.getElementById("ret-reason-select").value,
        notes: document.getElementById("ret-desc-input").value.trim(),
        status: "Pending Admin Approval",
        refundStatus: "Initiated",
        requestedAt: Date.now()

      saveState();
      closeModal();
      showToast("Return Request Sent to Admin Mukter Ali!");
      renderApp();

              <div class="flex flex-wrap gap-2">
                <button onclick="openLegalModal('About JAMS ELECTRONICS', '<p><strong>JAMS ELECTRONICS</strong> is founded and owned by <strong>Mukter Ali</strong>, located at <strong>Ramnagar, Gazole, Malda, West Bengal, India</strong>.</p><p>Launch Target: <strong>1 January 2027</strong>. Customer Helpline: <strong>8509842589</strong>.</p>')" class="bg-yellow-100 text-red-900 px-3 py-1.5 rounded-xl font-bold">About Us</button>
                <button onclick="openLegalModal('Privacy Policy & Terms', '<p>Customer addresses, phone numbers, and order history are strictly private and accessible only to the customer and authorized store admin (Mukter Ali) for order fulfillment.</p><p>Standard return window is 3 hours post-delivery; mandatory consumer rights for defective products are fully protected.</p>')" class="bg-yellow-100 text-red-900 px-3 py-1.5 rounded-xl font-bold">Privacy & Terms</button>
                <button onclick="openLegalModal('Future Multi-Seller Onboarding (Malda)', '<p>Authorized shopkeepers across Malda, West Bengal will soon be able to register, undergo Admin verification by Mukter Ali, and list products on JAMS ELECTRONICS.</p>')" class="bg-red-50 text-red-700 px-3 py-1.5 rounded-xl font-bold">Malda Seller Registration</button>
              </div>
              <p class="text-[11px] text-gray-400 pt-2 border-t border-gray-100">App Version: ${STORE_INFO.version} • Customer Support: 8509842589</p>
            </div>
          </div>
        </div>
      `;
    }

    function updateCustomerProfile(e) {
      e.preventDefault();
      appData.currentUser.name = document.getElementById("prof-name").value.trim();
      appData.currentUser.mobile = document.getElementById("prof-mob").value.trim();
      appData.currentUser.email = document.getElementById("prof-email").value.trim();
      appData.currentUser.address = document.getElementById("prof-addr").value.trim();
      appData.currentUser.pinCode = document.getElementById("prof-pin").value.trim();
      saveState();
      syncHeaderSecurity();
      showToast("Customer Profile & Delivery Address Saved!");
      renderApp();
    }

    // =========================================================================
    // 10. PRIVATE ADMIN DASHBOARD PANEL (MUKTER ALI ONLY)
    // =========================================================================
    function renderAdminDashboardPanel() {
      const totalProducts = appData.products.length;
      const totalOrders = appData.orders.length;
      const newOrders = appData.orders.filter(o => o.orderStatus === "Order Placed").length;
      const confirmedOrders = appData.orders.filter(o => o.orderStatus === "Order Confirmed").length;
      const deliveredOrders = appData.orders.filter(o => o.orderStatus === "Delivered").length;
      const cancelledOrders = appData.orders.filter(o => o.orderStatus === "Cancelled").length;
      const returnRequests = appData.orders.filter(o => o.orderStatus === "Return Requested" || o.returnRequest).length;
      const totalSales = appData.orders.filter(o => o.orderStatus !== "Cancelled").reduce((s, o) => s + o.totalAmount, 0);
      const lowStock = appData.products.filter(p => p.stock <= 5).length;

      return `
        <div class="bg-white rounded-3xl p-5 border-4 border-red-600 shadow-2xl space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-yellow-400 pb-3">
            <div>
              <h3 class="font-black text-lg text-red-700 uppercase">Private Admin Dashboard • Mukter Ali</h3>
              <p class="text-xs text-gray-500">Complete Store, Order, Video Ad, Offer & Inventory Control</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="openAdminProductModal()" class="bg-red-600 text-yellow-300 border border-yellow-400 px-3 py-1.5 rounded-xl text-xs font-black">+ Product</button>
              <button onclick="openAdminVideoModal()" class="bg-yellow-400 text-red-950 px-3 py-1.5 rounded-xl text-xs font-black">+ Video Ad</button>
              <button onclick="openAdminOfferModal()" class="bg-red-100 text-red-800 px-3 py-1.5 rounded-xl text-xs font-black">+ Offer</button>
            </div>
          </div>

          <!-- 9 Sales & Inventory KPI Cards -->
          <div class="grid grid-cols-3 sm:grid-cols-5 gap-2.5 text-center">
            <div class="bg-yellow-50 border border-yellow-400 p-2.5 rounded-2xl">
              <p class="text-[10px] font-bold text-gray-600">Total Products</p>
              <p class="text-lg font-black text-red-700">${totalProducts}</p>
            </div>
            <div class="bg-yellow-50 border border-yellow-400 p-2.5 rounded-2xl">
              <p class="text-[10px] font-bold text-gray-600">Total Orders</p>
              <p class="text-lg font-black text-red-700">${totalOrders}</p>
            </div>
            <div class="bg-yellow-50 border border-yellow-400 p-2.5 rounded-2xl">
              <p class="text-[10px] font-bold text-gray-600">New / Confirmed</p>
              <p class="text-lg font-black text-red-700">${newOrders} / ${confirmedOrders}</p>
            </div>
            <div class="bg-green-50 border border-green-300 p-2.5 rounded-2xl">
              <p class="text-[10px] font-bold text-green-800">Delivered / Sales</p>
              <p class="text-sm sm:text-base font-black text-green-700">${deliveredOrders} • ₹${totalSales.toLocaleString('en-IN')}</p>
            </div>
            <div class="bg-red-50 border border-red-300 p-2.5 rounded-2xl">
              <p class="text-[10px] font-bold text-red-800">Returns / Low Stock</p>
              <p class="text-lg font-black text-red-700">${returnRequests} / ${lowStock}</p>
            </div>
          </div>

          <!-- Admin Order Status & Return Controls -->
          <div class="space-y-2.5">
            <h4 class="font-black text-sm text-gray-900 uppercase">Customer Orders & Return Management</h4>
            ${appData.orders.map(o => `
              <div class="bg-gray-50 p-3.5 rounded-2xl border border-gray-200 space-y-2 text-xs">
                <div class="flex flex-wrap justify-between items-center gap-2">
                  <div>
                    <span class="font-black text-red-700">#${o.id}</span> • <strong>${o.customerName}</strong> (${o.customerMobile})
                    <p class="text-gray-600">Address: ${o.address} (PIN: ${o.pinCode}) • Payment: ${o.paymentMethod}</p>
                  </div>
                  <select onchange="adminChangeOrderStatus('${o.id}', this.value)" class="p-2 border-2 border-red-600 rounded-xl font-black bg-white text-xs">
                    ${ORDER_STATUSES.map(st => `<option value="${st}" ${o.orderStatus === st ? 'selected' : ''}>${st}</option>`).join('')}
                  </select>
                </div>
                ${o.returnRequest ? `
                  <div class="bg-red-100 p-2.5 rounded-xl flex flex-wrap items-center justify-between gap-2">
                    <span class="font-bold text-red-900">Return Claim: ${o.returnRequest.reason} (${o.returnRequest.status})</span>
                    <div class="flex gap-1.5">
                      <button onclick="adminResolveReturn('${o.id}', 'Approved', 'Refund Completed')" class="bg-green-600 text-white px-2.5 py-1 rounded-lg font-bold">Approve & Refund</button>
                      <button onclick="adminResolveReturn('${o.id}', 'Rejected', 'Rejected')" class="bg-red-700 text-white px-2.5 py-1 rounded-lg font-bold">Reject</button>
                    </div>
                  </div>
                ` : ""}
              </div>
            `).join('')}
          </div>

          <!-- Admin Product Inventory Table -->
          <div class="space-y-2">
            <h4 class="font-black text-sm text-gray-900 uppercase">Inventory, Prices & Stock Control</h4>
            <div class="divide-y divide-gray-200 border border-gray-200 rounded-2xl overflow-hidden">
              ${appData.products.map(p => `
                <div class="p-3 bg-white flex flex-wrap items-center justify-between gap-2 text-xs">
                  <div class="flex items-center gap-2.5">
                    <img src="${p.imageUrl}" class="w-10 h-10 rounded-lg object-cover" />
                    <div>
                      <p class="font-bold text-gray-900">${p.name}</p>
                      <p class="text-gray-500">Selling: <strong>₹${p.discountPrice}</strong> • Stock: <strong class="${p.stock <= 5 ? 'text-red-600' : 'text-green-700'}">${p.stock}</strong></p>
                    </div>
                  </div>
                  <div class="flex gap-1.5">
                    <button onclick="openAdminProductModal('${p.id}')" class="bg-yellow-400 text-red-950 px-3 py-1.5 rounded-xl font-black">Edit</button>
                    <button onclick="adminRemoveProduct('${p.id}')" class="bg-red-100 text-red-700 px-3 py-1.5 rounded-xl font-bold">Delete</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function adminChangeOrderStatus(orderId, status) {
      const order = appData.orders.find(o => o.id === orderId);
      if (!order) return;
      order.orderStatus = status;
      if (status === "Delivered" && !order.deliveredAt) {
        order.deliveredAt = Date.now(); // Triggers 3-hour customer return timer
      }
      saveState();
      showToast(`Order #${orderId} updated to ${status}`);
      renderApp();
    }

    function adminResolveReturn(orderId, status, refundStatus) {
      const order = appData.orders.find(o => o.id === orderId);
      if (!order || !order.returnRequest) return;
      order.returnRequest.status = status;
      order.returnRequest.refundStatus = refundStatus;
      saveState();
      showToast(`Return ${status} • ${refundStatus}`);
      renderApp();
    }

    function adminRemoveProduct(id) {
      appData.products = appData.products.filter(p => p.id !== id);
      saveState();
      showToast("Product Deleted");
      renderApp();
    }

    // Admin Video Ad & Offer Modals
    function openAdminVideoModal() {
      openModal(`
        <div class="bg-red-600 px-5 py-4 text-white flex items-center justify-between">
          <h3 class="font-black text-base uppercase text-yellow-300">Admin: Upload Promotional Video Ad</h3>
          <button onclick="closeModal()" class="p-1 bg-red-700 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="saveAdminVideo(event)" class="p-5 space-y-3 text-xs">
          <input type="text" id="v-title" required placeholder="Video Title *" class="w-full p-2.5 border-2 border-gray-300 rounded-xl font-bold" />
          <textarea id="v-desc" required rows="2" placeholder="Video Description *" class="w-full p-2.5 border-2 border-gray-300 rounded-xl"></textarea>
          <input type="text" id="v-url" value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoy.mp4" required placeholder="MP4 Video URL *" class="w-full p-2.5 border-2 border-gray-300 rounded-xl" />
          <select id="v-prod" class="w-full p-2.5 border-2 border-gray-300 rounded-xl font-bold bg-white">
            ${appData.products.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
          </select>
          <button type="submit" class="w-full bg-red-600 text-yellow-300 border-2 border-yellow-400 py-3 rounded-2xl font-black uppercase">Publish Video Ad</button>
        </form>
      `);
    }

    function saveAdminVideo(e) {
      e.preventDefault();
      appData.videoAds.unshift({
        id: "vid-" + Date.now(),
        title: document.getElementById("v-title").value.trim(),
        description: document.getElementById("v-desc").value.trim(),
        videoUrl: document.getElementById("v-url").value.trim(),
        linkedProductId: document.getElementById("v-prod").value
      });
      saveState();
      closeModal();
      showToast("Video Advertisement Published!");
      renderApp();
    }

    function adminDeleteVideo(id) {
      appData.videoAds = appData.videoAds.filter(v => v.id !== id);
      saveState();
      showToast("Video Ad Deleted");
      renderApp();
    }

    function openAdminOfferModal() {
      openModal(`
        <div class="bg-red-600 px-5 py-4 text-white flex items-center justify-between">
          <h3 class="font-black text-base uppercase text-yellow-300">Admin: Create Attractive Offer</h3>
          <button onclick="closeModal()" class="p-1 bg-red-700 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="saveAdminOffer(event)" class="p-5 space-y-3 text-xs">
          <select id="o-cat" class="w-full p-2.5 border-2 border-gray-300 rounded-xl font-bold bg-white">
            <option>Today's Deals</option>
            <option>Flash Sales</option>
            <option>Buy One Get One Offers</option>
            <option>Festival Offers</option>
            <option>Limited-Time Offers</option>
          </select>
          <input type="text" id="o-title" required placeholder="Offer Title *" class="w-full p-2.5 border-2 border-gray-300 rounded-xl font-bold" />
          <div class="grid grid-cols-3 gap-2">
            <input type="number" id="o-old" required placeholder="Old Price ₹" class="p-2.5 border-2 border-gray-300 rounded-xl font-bold" />
            <input type="number" id="o-new" required placeholder="New Price ₹" class="p-2.5 border-2 border-gray-300 rounded-xl font-bold" />
            <input type="text" id="o-code" required placeholder="Coupon Code" class="p-2.5 border-2 border-gray-300 rounded-xl font-bold uppercase" />
          </div>
          <input type="text" id="o-banner" required placeholder="Promotional Banner Text *" class="w-full p-2.5 border-2 border-gray-300 rounded-xl" />
          <button type="submit" class="w-full bg-red-600 text-yellow-300 border-2 border-yellow-400 py-3 rounded-2xl font-black uppercase">Publish Offer</button>
        </form>
      `);
    }

    function saveAdminOffer(e) {
      e.preventDefault();
      const oldP = Number(document.getElementById("o-old").value);
      const newP = Number(document.getElementById("o-new").value);
      const pct = oldP > newP ? Math.round(((oldP - newP) / oldP) * 100) : 15;
      appData.offers.unshift({
        id: "off-" + Date.now(),
        category: document.getElementById("o-cat").value,
        title: document.getElementById("o-title").value.trim(),
        oldPrice: oldP,
        newPrice: newP,
        discountPct: pct,
        code: document.getElementById("o-code").value.trim().toUpperCase(),
        bannerText: document.getElementById("o-banner").value.trim()
      });
      saveState();
      closeModal();
      showToast("New Offer Published!");
      renderApp();
    }

    function adminDeleteOffer(id) {
      appData.offers = appData.offers.filter(o => o.id !== id);
      saveState();
      showToast("Offer Removed");
      renderApp();
    }

    // =========================================================================
    // 11. MAIN RENDER ENGINE
    // =========================================================================
    function renderApp() {
      const root = document.getElementById("app-root");
      if (uiState.activeTab === "home") root.innerHTML = renderHomeView();
      else if (uiState.activeTab === "categories") root.innerHTML = renderCategoriesView();
      else if (uiState.activeTab === "offers") root.innerHTML = renderOffersView();
      else if (uiState.activeTab === "cart") root.innerHTML = renderCartView();
      else if (uiState.activeTab === "account") root.innerHTML = renderAccountView();
      lucide.createIcons();
    }

    window.onload = function () {
      syncHeaderSecurity();
      renderApp();
    };
  </script>
</body>
</html>
